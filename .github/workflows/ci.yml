name: ci

on:
  push:
    branches: [main, staging, development]
  pull_request:

# The workflow's token reads the code and nothing more; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  ci:
    uses: likho-ai/likho-infra/.github/workflows/python-ci.yml@main
    with:
      # The integration tests come with the registry (step 10, piece 2); then "postgres nats".
      stack-services: ""

  publish:
    needs: ci
    if: github.event_name == 'push'      # development, staging or main: the branch's image
    uses: likho-ai/likho-infra/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
