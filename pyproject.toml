[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "likho-ml"
version = "0.2.0"
description = "Likho model service: the speech model registry, gold-set evaluations, training examples from corrections, fine-tuning runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "likho-contracts",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "nats-py>=2.9",
    "pydantic-settings>=2.6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-prometheus>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "prometheus-client>=0.21",
    "boto3>=1.35",
]

[project.scripts]
likho-ml = "likho_ml.__main__:main"

[tool.uv.sources]
likho-contracts = { git = "https://github.com/likho-ai/likho-contracts", tag = "v0.14.0-rc.3", subdirectory = "packages/python" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/likho_ml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Devanagari strings are intentional, not "ambiguous" characters
]

[tool.ruff.lint.per-file-ignores]
"src/likho_ml/grpc_server.py" = ["N802"]  # gRPC method names are CamelCase by contract

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# likho.* is the generated contracts package: it ships .pyi stubs but no py.typed marker yet.
module = ["grpc.*", "grpc_health.*", "nats.*", "likho.*", "google.protobuf.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = ["integration: needs PostgreSQL and NATS from likho-infra (bash scripts/up.sh)"]
